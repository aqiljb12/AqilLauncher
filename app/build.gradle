plugins {
    id 'com.android.application'
}

android {
    namespace 'com.aqil.launcher'
    compileSdk 34

    defaultConfig {
        applicationId 'com.aqil.launcher'
        minSdk 21
        targetSdk 33
        versionCode 2
        versionName '2.0.0'
    }

    signingConfigs {
        // Kunci tetap supaya APK baru boleh dipasang atas APK lama (dari build ini).
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.debug }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError false }
}

name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AqilLauncher.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AqilLauncher-apk
          path: AqilLauncher.apk
      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Aqil Launcher build ${{ github.run_number }}
          files: AqilLauncher.apk
          prerelease: true
